org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
# Gradle 8.11 cannot run on the Homebrew JDK 25 that is first on PATH; use Android Studio's bundled JDK 21.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Release signing. Leave empty here; put the real values in ~/.gradle/gradle.properties
# (never commit them). See docs/RELEASE.md.
MEMORY_GAME_KEYSTORE=
MEMORY_GAME_STORE_PASSWORD=
MEMORY_GAME_KEY_ALIAS=
MEMORY_GAME_KEY_PASSWORD=
